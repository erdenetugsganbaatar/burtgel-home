<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 69" width="104" height="69" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dome" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#EFF7FC"/>
      <stop offset="0.45" stop-color="#EFF7FC"/>
      <stop offset="1" stop-color="#D9E8F6"/>
    </linearGradient>
  </defs>

  <!-- dome (cap base) -->
  <path d="M29 30 V50 C29 60 71 60 71 50 V30 Z" fill="url(#dome)"/>

  <!-- board edge (thickness) -->
  <path d="M15 25 L52 43.5 L89 23 L89 26 L52 46.5 L15 28 Z"
        fill="#B9D3F2" stroke="#B9D3F2" stroke-width="4" stroke-linejoin="round"/>

  <!-- board top -->
  <path d="M15 25 L51 7 L89 23 L52 43.5 Z"
        fill="#EFF7FC" stroke="#EFF7FC" stroke-width="5" stroke-linejoin="round"/>

  <!-- cord -->
  <path d="M54 22 L74 30 V44" fill="none" stroke="#E53935" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tassel: knot + skirt -->
  <ellipse cx="74" cy="46" rx="3" ry="2.8" fill="#E53935"/>
  <path d="M71.8 48.5 H76.2 L78.2 58.5 C78.2 61.5 69.8 61.5 69.8 58.5 Z" fill="#E53935"/>

  <!-- button -->
  <ellipse cx="53.5" cy="21.5" rx="3.2" ry="2.4" fill="#2F7FEF"/>
</svg>
